# Not used for local dev — matches file-service's/auth-service's convention.
#
# Shared infrastructure (Postgres, Kafka, Milvus, OpenSearch, and
# file-service's dedicated `file-minio` instance) lives in the ROOT
# docker-compose.yml and is started via `make infra` from this directory.
# The app itself runs locally with `uv run uvicorn` (see `make run`/
# `make run-worker`), not containerized, for fast reload and to stay
# consistent with every other GraphGPT service in this repo.
#
# The Dockerfile is still built for actual deployment (see
# docs/IMPLEMENTATION_PLAN.md Phase 13). If a one-off containerized run is
# ever needed locally, uncomment below and run `docker compose up` from this
# directory after `make infra`.
