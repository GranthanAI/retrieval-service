syntax = "proto3";

package retrieval;

service RetrievalService {
  // Retrieve top-k relevant document chunks
  rpc GetRelevantChunks(GetRelevantChunksRequest) returns (GetRelevantChunksResponse);
  // Additive: every chunk of the authorised, current versions of the given files, in document order (for small documents sent in full).
  // Servers that do not implement it answer UNIMPLEMENTED.
  rpc GetDocumentChunks(GetDocumentChunksRequest) returns (GetDocumentChunksResponse);
}

enum RetrievalScope {
  FILES = 0;
  KNOWLEDGE_BASE = 1;
  ALL = 2;
}

// Outcome of a retrieval query. OK = 0 is the proto3 default, so an older server that does not
// set the field is read as OK by a newer client (and an older client simply ignores the field).
enum RetrievalStatus {
  OK = 0;               // chunks returned
  NO_MATCH = 1;         // documents are indexed and accessible, but nothing relevant matched
  NO_SCOPE = 2;         // request had no file scope to search
  ACCESS_DENIED = 3;    // none of the requested documents is accessible to the user (or does not exist / deleted)
  NOT_INDEXED = 4;      // accessible, but no indexed version is registered yet
  INDEXING = 5;         // accessible, current version is still being indexed
  INDEXING_FAILED = 6;  // accessible, indexing of the current version failed
  UNAVAILABLE = 7;      // a dependency (permission check, embedding, both search engines) failed
  TIMEOUT = 8;          // the query deadline was exceeded
}

// How well the retrieved passages cover the question. COVERAGE_UNSPECIFIED = 0 is what an older server sends, so a newer client
// treats it as "no signal".
enum Coverage {
  COVERAGE_UNSPECIFIED = 0;
  STRONG = 1;   // at least one passage clearly answers the question
  WEAK = 2;     // passages were found but none clearly answers it
  NONE = 3;     // nothing relevant was found
}

message GetRelevantChunksRequest {
  string user_id = 1;
  string conversation_id = 2;
  string query = 3;
  int32 top_k = 4;
  RetrievalScope scope = 5;       // FILES | KNOWLEDGE_BASE | ALL
  repeated string file_ids = 6;   // for Ask Files mode
  float min_relevance_score = 7;
  int32 max_tokens = 8;
  string trace_id = 9;
  // Optional. A standalone rewrite of the question in a form that embeds well (e.g. English). When set, the dense leg embeds this
  // and the keyword leg still uses `query`.
  optional string dense_query = 10;
  // Optional. Chunk ids shown in the previous assistant turn. Added as candidates after the authorisation and current-version checks.
  repeated string previous_chunk_ids = 11;
}

message DocumentChunk {
  string chunk_id = 1;
  string content = 2;
  string source_file_id = 3;
  string source_name = 4;
  float relevance_score = 5;
  map<string, string> metadata = 6;
}

message GetRelevantChunksResponse {
  repeated DocumentChunk chunks = 1;
  int32 total_tokens = 2;
  string request_id = 3;
  RetrievalStatus status = 4;
  // Short, non-sensitive explanation of `status` (never contains document content).
  string status_detail = 5;
  int32 requested_count = 6;   // distinct document ids in the request
  int32 authorized_count = 7;  // of which the user may read
  int32 ready_count = 8;       // of which have a fully indexed current version
  // Optional weak-retrieval signal. top_score is the best reranker score (or a rank-derived score when reranking is off).
  optional float top_score = 9;
  Coverage coverage = 10;
}

message GetDocumentChunksRequest {
  string user_id = 1;
  repeated string file_ids = 2;
  int32 max_tokens = 3;   // 0 = no limit; otherwise chunks are returned in document order until the budget is reached
  string trace_id = 4;
}

message GetDocumentChunksResponse {
  repeated DocumentChunk chunks = 1;   // grouped by file in request order, then in document order
  int32 total_tokens = 2;
  string request_id = 3;
  RetrievalStatus status = 4;
  string status_detail = 5;
  bool truncated = 6;                  // true when max_tokens cut the text short
  int32 requested_count = 7;
  int32 authorized_count = 8;
  int32 ready_count = 9;
}
