[project]
name = "retrieval-service"
version = "0.1.0"
description = "Granthan Retrieval Service — ingests uploaded documents into Milvus/OpenSearch and serves top-K relevant chunks over gRPC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aiokafka>=0.10.0",
    "pymilvus>=2.3.0",
    "opensearch-py>=2.5.0",
    "docling>=1.0.0",
    "minio>=7.2.5",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "testcontainers[postgres,kafka]>=4.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
